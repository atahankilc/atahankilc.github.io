name = "atahan-twin"
main = "worker.js"
compatibility_date = "2026-10-01"
preview_urls = false

[vars]
# gpt-5-nano: the cheapest OpenAI text model ($0.05 in / $0.005 cached / $0.40 out per 1M tokens).
# Fallback without reasoning: "gpt-4.1-nano" ($0.10 / $0.025 / $0.40).
MODEL = "gpt-5-nano"
# Only the live site. Local dev origins go in .dev.vars (never deployed).
ALLOWED_ORIGINS = "https://atahankilc.github.io"
# Hard daily caps on OpenAI calls (counted in the Budget Durable Object, reset at 00:00 UTC).
DAILY_LIMIT = "1500"
DAILY_LIMIT_PER_IP = "40"

# Per-IP burst limit, enforced by Cloudflare (approximate, per location)
[[ratelimits]]
name = "BURST"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 6
  period = 60

[[durable_objects.bindings]]
name = "BUDGET"
class_name = "Budget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Budget"]

# Secret (never commit it): wrangler secret put OPENAI_API_KEY
