<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
<title>Atahan Kılıç — digital twin</title>
<meta name="description" content="Talk to the digital twin of Atahan Kılıç, an AI & full-stack software engineer in Munich. Ask about projects, experience and how to reach him.">
<link href="assets/fonts/vt323.css" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#050505;overflow:hidden;overscroll-behavior:none}
  /* touch scrolling is done by hand (rows + momentum), so the browser must not pan, zoom or call up the image menu */
  canvas#crt{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;cursor:text;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  canvas#crt.link{cursor:pointer}
  #kbd{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px}
  /* phones: the real input lies over the drawn prompt, so a tap there is a native tap (keyboard, caret, paste) */
  #kbd.dock{z-index:2;margin:0;box-sizing:border-box;outline:0;background:transparent;font-family:VT323,monospace;-webkit-tap-highlight-color:transparent}
  /* the one thing that can't live inside the shader: a live, interactive website */
  #live{position:fixed;display:none;z-index:3;background:#000}
  #live.on{display:block}
  #live iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
  #live .tint{position:absolute;inset:0;pointer-events:none;mix-blend-mode:color}
  #live .lines{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.28) 2px 3px)}
  #live .edge{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 40px rgba(0,0,0,.8)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<canvas id="crt" aria-hidden="true"></canvas>
<form id="kbdForm" action="javascript:void 0"><input id="kbd" autocapitalize="off" autocomplete="off" spellcheck="false" enterkeyhint="send" aria-label="Ask Atahan's digital twin"></form>
<div id="live"><iframe title="live demo" sandbox="allow-scripts allow-same-origin allow-popups allow-forms" referrerpolicy="no-referrer"></iframe><div class="tint"></div><div class="lines"></div><div class="edge"></div></div>
<main class="sr" id="sr"></main>
<div class="sr" id="said" aria-live="polite"></div>
<script src="assets/content.js"></script>
<script src="twin/twin.config.js"></script>
<script>
const C = window.CONTENT;
const PHOSPHORS = { green: "#5dff8f", amber: "#ffb43a", white: "#e8f0ff", cyan: "#62f3ff", magenta: "#ff5ad1" };
const CV = "assets/cv.pdf";
const $ = (s) => document.querySelector(s);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// ======================================================================
// knowledge — the only things the twin may talk about
// ======================================================================
const P = Object.fromEntries(C.projects.map((p) => [p.id, p]));
// every bar opens its full story (C.roles[key]); the thesis sits under TUM, project diamonds are gone
const GANTT = [
  { key: "metu", label: "METU · B.Sc. CE", short: "METU", lane: "edu", from: "2018-09", to: "2023-07" },
  { key: "havelsanCand", label: "HAVELSAN · cand.", short: "HAVELSAN", lane: "work", from: "2021-11", to: "2023-07" },
  { key: "havelsanDev", label: "HAVELSAN · dev", short: "↳ developer", lane: "work", from: "2023-08", to: "2024-03" },
  { key: "tum", label: "TUM · M.Sc.", short: "TUM", lane: "edu", from: "2024-04", to: "now" },
  { key: "thesis", label: "↳ BugSense", short: "↳ thesis", lane: "edu", from: "2026-04", to: "now", hot: true },
  { key: "nextaim", label: "NextAim", short: "NextAim", lane: "work", from: "2024-09", to: "2026-03" },
  { key: "check24", label: "CHECK24", short: "CHECK24", lane: "work", from: "2026-07", to: "now" },
];
const ALIASES = {
  harmos: ["harmos", " cad"], bugsense: ["bugsense", "bug sense", " uti", "thesis", " tez", "medical", "diagnos"],
  steward: ["steward", "talk to your building", "your building", "synera", "indoor", "navigation", "industrial agents"], sharksight: ["sharksight", "shark", " bmw"],
  northstar: ["north star", "northstar", "ideation"], router: ["routemaxx", "router", "routing", "tum.ai", "slop"],
  tate: [" tate", "teacher", "öğretmen"],
};

// ======================================================================
// screen model — everything is drawn into a character grid that goes
// through the CRT shader. A row is a list of segments:
//   { t, b }            text at brightness b (0..1)
//   { t, b, act }       clickable (act = { key, fn }) — inverts on hover
//   { t, b, inv }       inverted (filled cell, dark text)
//   { t, b, bar }       filled cells ("solid" | "hatch") — glyph-free bars
// ======================================================================
const S = (t, b = 0.82, o = {}) => ({ t: String(t), b, ...o });
const DIM = 0.48, TXT = 0.82, HOT = 1;
const blocks = [];          // everything in the conversation log
let scroll = 0;             // rows scrolled up from the bottom
let suggestions = [];
let pane = null;            // { kind: "peek", id } | { kind: "project", id, mode, scroll }
let inputText = "", busy = false, skip = false, powerT = 0;

function wrapInto(rows, cur, text, b, cols) {
  // append text to the current row, wrapping on word boundaries
  const width = () => cur.reduce((n, s) => n + s.t.length, 0);
  for (const para of text.split(/(\n)/)) {
    if (para === "\n") { rows.push(cur.splice(0)); continue; }
    for (const w of para.split(/([ \t]+)/)) {   // not \s: a no-break space (NB) must hold
      if (!w) continue;
      if (width() + w.length > cols && width() > 0) { rows.push(cur.splice(0)); if (/^[ \t]+$/.test(w)) continue; }
      if (w.length > cols) { for (let i = 0; i < w.length; i += cols) { if (width() > 0) rows.push(cur.splice(0)); cur.push(S(w.slice(i, i + cols), b)); } continue; }
      cur.push(S(w, b));
    }
  }
}
const lineBlock = (rows) => ({ render: () => rows });
function textBlock(text, b = TXT) { return { render(cols) { const rows = [], cur = []; wrapInto(rows, cur, text, b, cols); rows.push(cur); return rows; } }; }
function userBlock(text) {
  return { render(cols) { const rows = [], cur = [S("> ", DIM)]; wrapInto(rows, cur, text, HOT, cols); rows.push(cur, []); return rows; } };
}
// a twin turn: text deltas and widgets, revealed in order like a teletype
function twinBlock() {
  const m = {
    parts: [], idx: 0, shown: 0, wait: 0, closed: false, done: false, onDone: null,
    text(s) { const last = m.parts[m.parts.length - 1]; if (last && last.kind === "text" && m.parts.indexOf(last) >= m.idx) last.s += s; else m.parts.push({ kind: "text", s }); },
    widget(w) { if (w) m.parts.push({ kind: "widget", w }); },
    tick(dt) {
      if (m.done) return;
      while (m.idx < m.parts.length) {
        const p = m.parts[m.idx];
        if (p.kind === "text") {
          if (skip || cfg.cps >= 2000) m.shown = p.s.length; else m.shown += cfg.cps * dt;
          if (m.shown < p.s.length) return;
          if (m.idx === m.parts.length - 1 && !m.closed) return;   // more text may still stream in
          m.idx++; m.shown = 0;
        } else {
          if (!p.shownAt) { p.shownAt = performance.now(); p.w.onShow?.(); p.w.born = performance.now() / 1000; }
          if (!skip && performance.now() - p.shownAt < 160) return;
          m.idx++;
        }
      }
      if (m.closed) { m.done = true; m.onDone?.(); }
    },
    render(cols, t) {
      const rows = [], cur = [S("atahan › ", DIM)];
      for (let i = 0; i <= Math.min(m.idx, m.parts.length - 1); i++) {
        const p = m.parts[i];
        if (p.kind === "text") wrapInto(rows, cur, i < m.idx ? p.s : p.s.slice(0, Math.floor(m.shown)), TXT, cols);
        else if (i < m.idx || p.shownAt) { if (cur.length) rows.push(cur.splice(0)); rows.push(...p.w.render(cols, t)); }
      }
      // the caret blinks by inverting, never by appearing/disappearing, and an empty caret row
      // takes the place of the trailing spacer, so the row count never changes and the log can't bob
      const caret = m.done ? [] : [S(" ", HOT, { inv: Math.floor(t * 2.2) % 2 === 0 })];
      if (cur.length) rows.push([...cur, ...caret], []); else rows.push(caret);
      return rows;
    },
  };
  blocks.push(m); scroll = 0;
  return m;
}

// ======================================================================
// widgets — the GUI inside the terminal
// ======================================================================
const pad = (s, n) => { s = String(s); return s.length >= n ? s.slice(0, Math.max(0, n - 1)) + (n > 0 ? "…" : "") : s + " ".repeat(n - s.length); };
function box(title, inner, cols, maxW = 96) {
  // inner(innerCols) -> rows; wraps them in ┌─ title ─┐ … └──┘
  const W = Math.min(cols, maxW), iw = W - 4, rows = inner(iw);
  const top = "┌─ " + title + " " + "─".repeat(Math.max(0, W - title.length - 5)) + "┐";
  const out = [[S(top, DIM)]];
  rows.flatMap((r) => rewrap(r, iw)).forEach((r) => { r = clip(r, iw); out.push([S("│ ", DIM), ...r, S(" ".repeat(Math.max(0, iw - rowLen(r))) + " │", DIM)]); });
  out.push([S("└" + "─".repeat(W - 2) + "┘", DIM)]);
  return out;
}
const rowLen = (r) => r.reduce((n, s) => n + s.t.length, 0);
function clip(r, n) { const out = []; for (const s of r) { const room = n - rowLen(out); if (room <= 0) break; out.push(s.t.length > room ? { ...s, t: s.t.slice(0, room) } : s); } return out; }
function flow(segs, cols) {
  // wrap whole segments (buttons, tags) onto new rows instead of cutting them
  const rows = [[]];
  for (const s of segs) { const r = rows[rows.length - 1]; if (rowLen(r) + s.t.length > cols && rowLen(r) > 0) { if (!s.t.trim()) continue; rows.push([s]); } else r.push(s); }
  return rows.flatMap((r) => rewrap(r, cols));   // a segment wider than the whole line still breaks between words
}
// a row too wide for its space breaks between words (keeping each word's style and action) instead of losing its end;
// bars and no-break runs stay whole unless they alone are wider than the line
function rewrap(r, n) {
  if (rowLen(r) <= n) return [r];
  const rows = [[]];
  for (const s of r) {
    const words = s.bar ? [s.t] : s.t.length > n ? s.t.replace(/ /g, " ").split(/( +)/) : s.t.split(/( +)/);
    for (const w of words) {
      if (!w) continue;
      const cur = rows[rows.length - 1];
      if (rowLen(cur) + w.length > n && rowLen(cur) > 0) { if (!w.trim()) continue; rows.push([]); }
      rows[rows.length - 1].push({ ...s, t: w });
    }
  }
  return rows;
}
const NB = (s) => s.replace(/ /g, "\u00a0");
// a project's stack as [tags]; short views show the first n and point to the architecture view for the rest
const tags = (p, n = Infinity) => p.stack.slice(0, n).map((s) => NB(`[${s}]`)).join(" ") + (p.stack.length > n ? `  +${p.stack.length - n} more in architecture` : "");   // keep "[B-Rep kernel]" or "──▶ [ Engine ]" on one line
const btn = (label, key, fn, b = HOT) => S(`[${label}]`, b, { act: { key, fn } });
const gap = (n = 1) => S(" ".repeat(n), TXT);

const W = {
  whoami: () => ({
    tl: null,
    render(cols, t) {
      if (!this.tl) this.tl = W.timeline();
      this.tl.born = this.born;
      return box("atahan@munich", (iw) => {
        const rows = [...flow([S(NB(C.name.toUpperCase()), HOT), gap(3), S(NB(`${C.role} · ${C.location}`), TXT)], iw)], cur = [];
        wrapInto(rows, cur, `"${C.tagline}"`, DIM, iw); rows.push(cur.splice(0), []);
        // three panels side by side; stacked full width when the screen is narrow
        const across = iw >= 60 ? 3 : 1, pw = Math.floor((iw - (across - 1)) / across), cw = across === 1 ? iw : pw - 4;
        const panels = C.glance.map((g) => {
          const body = [];
          g.items.forEach(([head, sub, id], i) => {
            const act = id && P[id] ? { act: { key: "who:" + id, fn: () => ask(`tell me about ${P[id].title}`) } } : {};
            if (i) body.push([]);
            body.push([S(pad(head + (id ? " ›" : ""), cw), HOT, act)]);
            const r = [], c = []; wrapInto(r, c, sub, TXT, cw); r.push(c); body.push(...r);
          });
          return body;
        });
        // one column: a box inside the card is just noise, so each panel is a ruled heading over its lines
        if (across === 1) panels.forEach((body, i) => { const n = C.glance[i].title.toUpperCase(); rows.push([S(n + " ", HOT), S("─".repeat(Math.max(0, iw - n.length - 1)), DIM)], ...body, []); });
        else for (let i = 0; i < panels.length; i += across) {
          const group = panels.slice(i, i + across), names = C.glance.slice(i, i + across).map((g) => g.title.toUpperCase());
          const h = Math.max(...group.map((b) => b.length)), line = [];
          names.forEach((n, j) => line.push(...(j ? [gap()] : []), S("┌ ", DIM), S(n, HOT), S(" " + "─".repeat(Math.max(0, pw - n.length - 4)) + "┐", DIM)));
          rows.push(line);
          for (let y = 0; y < h; y++) {
            const r = [];
            group.forEach((b, j) => { const c = clip(b[y] || [], cw); r.push(...(j ? [gap()] : []), S("│ ", DIM), ...c, S(" ".repeat(cw - rowLen(c)) + " │", DIM)); });
            rows.push(r);
          }
          rows.push(group.flatMap((_, j) => [...(j ? [gap()] : []), S("└" + "─".repeat(pw - 2) + "┘", DIM)]));
        }
        rows.push([], ...this.tl.render(iw, t));
        const st = [], sc = []; wrapInto(st, sc, C.availability, HOT, iw - 8); st.push(sc);
        rows.push([], ...st.map((r, i) => [S(pad(i ? "" : "status", 8), TXT), ...r]), []);
        rows.push(...flow([btn("projects", "who:projects", () => ask("show me your projects")), gap(),
          btn("stack", "who:stack", () => ask("what's your stack?")), gap(), btn("contact", "who:contact", () => ask("how can I reach you?"))], iw));
        return rows;
      }, cols, cols);   // the card spans the whole log, like the timeline
    },
  }),
  projects: () => ({
    onShow: () => PHONE || openPeek(C.projects[0].id),
    render(cols) {
      if (PHONE) {   // no hover and no room for a preview: each project is a two-line, full-width tap target
        const rows = [];
        C.projects.forEach((p) => {
          const act = { key: "open:" + p.id, fn: () => ask(`tell me about ${p.title}`) }, yr = p.when || p.year, demo = p.live ? "● live" : "○ src";
          rows.push([S(pad("▸ " + p.title, cols - yr.length - demo.length - 2), HOT, { act }), S(yr + "  ", DIM, { act }), S(demo, p.live ? HOT : TXT, { act })],
            [S(pad("  " + p.kind, cols), DIM, { act })], []);
        });
        rows.push([S("tap a project to open it", DIM)]);
        return rows;
      }
      const tw = Math.max(...C.projects.map((p) => p.title.length)) + 2, ww = cols - tw - 22, what = ww >= 12;
      const rows = [[S(pad("   project", tw + 3), DIM), ...(what ? [S(pad("what", ww), DIM)] : []), S(pad("year", 12), DIM), S("demo", DIM)]];
      rows.push([S("─".repeat(Math.min(cols, tw + (what ? ww : 0) + 22)), DIM)]);
      C.projects.forEach((p) => {
        const act = { key: "open:" + p.id, fn: () => ask(`tell me about ${p.title}`) }, sel = pane?.kind === "peek" && pane.id === p.id;
        rows.push([S(sel ? " ▸ " : "   ", HOT), S(pad(p.title, tw), HOT, { act, inv: sel }), ...(what ? [S(pad(p.kind, ww), TXT, { act })] : []),
          S(pad(p.when || p.year, 12), TXT, { act }), S(p.live ? "● live" : "○ src", p.live ? HOT : TXT, { act })]);
      });
      rows.push([], [S("hover or ↑↓ to preview · click or enter to open", DIM)]);
      return rows;
    },
  }),
  project: (p) => ({
    onShow: () => PHONE || openView(p.id, "auto"),   // phones: the card's buttons open the viewer, so the answer stays in sight
    render(cols) {
      return box(p.id, (iw) => {
        const rows = [], cur = [];
        rows.push([S(p.title.toUpperCase(), HOT)], [S(`${p.kind} · ${p.when || p.year}`, DIM)], []);
        wrapInto(rows, cur, p.blurb, TXT, iw); rows.push(cur.splice(0), []);
        wrapInto(rows, cur, tags(p, PHONE ? 6 : 10), DIM, iw); rows.push(cur.splice(0), []);
        const bs = [];
        if (p.live) bs.push(btn(`▶ ${p.liveLabel || "live demo"}`, `v:${p.id}:live`, () => openView(p.id, "live")), gap());
        bs.push(btn("architecture", `v:${p.id}:arch`, () => openView(p.id, "arch")));
        if (p.link) bs.push(gap(), btn("source ↗", `src:${p.id}`, () => window.open(p.link, "_blank", "noopener")));
        rows.push(...flow(bs, iw));
        return rows;
      }, cols);
    },
  }),
  timeline: () => ({
    render(cols, t) {
      const age = t - (this.born || t), grow = Math.min(1, age / 1.2);
      const wideL = cols > 70, labW = wideL ? 17 : 12, T = Math.max(20, cols - labW - 1);
      const y0 = 2018, y1 = 2027, per = T / (y1 - y0);
      const at = (d) => { if (d === "now") { const n = new Date(); d = `${n.getFullYear()}-${n.getMonth() + 1}`; } const [y, m] = d.split("-").map(Number); return Math.max(0, Math.min(T, ((y - y0) + (m - 1) / 12) * per)); };
      const rows = [];
      let axis = ""; const every = per >= 4 ? 1 : 2;
      for (let yr = 0; yr < y1 - y0; yr += every) axis = axis.padEnd(Math.round(yr * per)) + (per >= 6 ? String(y0 + yr) : "'" + String(y0 + yr).slice(2));
      let tick = ""; for (let c = 0; c < T; c++) tick += c === 0 || Math.floor(c / per) !== Math.floor((c - 1) / per) ? "┼" : "─";
      const nowC = Math.round(at("now"));
      rows.push([S(" ".repeat(labW + 1)), S(" ".repeat(Math.max(0, nowC - 5)) + "now ▼", HOT)]);
      rows.push([S(" ".repeat(labW + 1)), S(axis.slice(0, T), DIM)]);
      rows.push([S(" ".repeat(labW + 1)), S(tick, DIM)]);
      GANTT.forEach((g, i) => {
        const a = Math.round(at(g.from)), b = Math.max(a + 1, Math.round(at(g.to))), len = Math.round((b - a) * Math.min(1, Math.max(0, grow * 1.6 - i * 0.1)));
        const act = { key: "g:" + g.key, fn: () => explain(g) };
        rows.push([S(pad(wideL ? g.label : g.short, labW), g.hot ? HOT : TXT, { act }), gap(), S("·".repeat(a), 0.22), S(" ".repeat(len), g.lane === "work" ? 0.95 : g.hot ? HOT : 0.75, { bar: g.lane === "work" ? "solid" : "hatch", act }), S("·".repeat(Math.max(0, T - a - len)), 0.22)]);
      });
      return [...rows, [S(" ".repeat(labW + 1)), S(tick, DIM)], [], ...flow([S("■ work", 0.95), gap(2), S("▒ education", 0.75), gap(2), S(`· ${TOUCH ? "tap" : "click"} a bar for the full story`, DIM)], cols)];
    },
  }),
  // one timeline bar, told properly: story on the left, what I did on the right (stacked when narrow)
  role: (g) => ({
    render(cols) {
      const r = C.roles[g.key];
      return box(g.lane === "work" ? "experience" : "education", (iw) => {
        const rows = [...flow([S(NB(r.org.toUpperCase()), HOT), gap(3), S(r.role, TXT), gap(3), S(NB(`${span(g.from, g.to)} · ${r.where}`), DIM)], iw), []];
        const side = r.did.length && iw >= 110, lw = side ? Math.floor(iw * 0.42) : iw, rw = side ? iw - lw - 4 : iw;
        const left = [], cur = []; wrapInto(left, cur, r.story, TXT, lw); left.push(cur.splice(0));
        const right = r.did.flatMap((d, i) => { const b = []; wrapInto(b, cur, d, TXT, rw - 2); b.push(cur.splice(0)); return [...(i ? [[]] : []), ...b.map((l, j) => [S(j ? "  " : "▸ ", HOT), ...l])]; });
        if (side) for (let i = 0; i < Math.max(left.length, right.length); i++) { const l = left[i] || []; rows.push([...l, S(" ".repeat(lw - rowLen(l) + 4)), ...(right[i] || [])]); }
        else rows.push(...left, ...(right.length ? [[], ...right] : []));
        if (r.tags.length) rows.push([], ...flow(r.tags.flatMap((t) => [S(NB(`[${t}]`), DIM), gap()]), iw));
        if (r.project) rows.push([], ...flow([btn(`${P[r.project].title} project ›`, "role:" + r.project, () => ask(`tell me about ${P[r.project].title}`))], iw));
        return rows;
      }, cols, cols);
    },
  }),
  skills: () => ({
    render(cols) {
      return box("~/stack", (iw) => Object.entries(C.skills).flatMap(([k, v]) => { const rows = [], cur = []; wrapInto(rows, cur, v.map(NB).join("  "), HOT, iw - 7); rows.push(cur); return rows.map((r, i) => [S(pad(i ? "" : k.toLowerCase(), 7), TXT), ...r]); }), cols, 90);
    },
  }),
  contact: () => ({
    render(cols) {
      return box("contact", (iw) => [
        [S(pad("linkedin", 9), TXT), S(C.linkedin.replace("https://www.", ""), HOT)], [S(pad("email", 9), TXT), S(C.email, HOT)], [S(pad("github", 9), TXT), S(C.github.replace("https://", ""), HOT)], [S(pad("based", 9), TXT), S(C.location, HOT)], [],
        ...flow([btn("message me on linkedin ↗", "li", () => window.open(C.linkedin, "_blank", "noopener")), gap(), btn(copied ? "copied ✓" : "copy email", "copy", copyEmail), gap(), btn("github ↗", "gh", () => window.open(C.github, "_blank", "noopener")), gap(), btn("cv.pdf ↓", "cv", downloadCV)], iw),
      ], cols, 90);
    },
  }),
  cv: () => ({ render: () => [[btn("⇩ download cv.pdf", "cv", downloadCV), gap(2), btn("or see it as a timeline", "tl", () => ask("show me your career timeline"), TXT)]] }),

canvas.addEventListener("pointermove", (e) => { if (e.pointerType !== "touch") pointer = [e.clientX, e.clientY]; });
canvas.addEventListener("pointerleave", () => (pointer = null));
canvas.addEventListener("click", (e) => {
  if (performance.now() - dragEnd < 80) return;   // the end of a swipe is not a tap
  const touch = TOUCH || e.pointerType === "touch", h = hitAt(e.clientX, e.clientY, touch);
  if (h) h.act.fn();
  if (!PHONE) focusKbd();       // desktop: typing anywhere goes to the prompt
  else if (!h) kbd.blur();      // phones: a tap on empty screen puts the keyboard away; the prompt row itself is the real input
});
// accumulate wheel delta so trackpads (many small events) don't race; ~1 row per 40px, 1 row per wheel line
let wheelAcc = 0;
canvas.addEventListener("wheel", (e) => {
  wheelAcc += e.deltaMode === 1 ? e.deltaY * 40 : e.deltaMode === 2 ? e.deltaY * 400 : e.deltaY;
  const rows = Math.trunc(wheelAcc / 40);
  if (!rows) return;
  wheelAcc -= rows * 40;
  const [x, y] = screenToTex(e.clientX, e.clientY), b = paneBox;
  if ((pane?.kind === "project" || pane?.view === "arch") && b && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) pane.scroll = (pane.scroll || 0) + rows;
  else scroll = Math.max(0, scroll - rows);
}, { passive: true });
// touch: the content follows the finger row by row and keeps gliding after a flick; a press lights its target up
let drag = null, fling = null, dragEnd = 0;
const rowPx = () => cell.h * VH / tc.height;   // one text row in CSS pixels
function scrollRowsBy(target, rows) {   // rows > 0: further down the content
  if (target === "pane") { if (pane) pane.scroll = Math.max(0, (pane.scroll || 0) + rows); }
  else scroll = Math.max(0, scroll - rows);
}
canvas.addEventListener("pointerdown", (e) => {
  if (e.pointerType !== "touch") return;
  const [x, y] = screenToTex(e.clientX, e.clientY), b = paneBox;
  const inPane = pane && b && (PHONE || pane.kind === "project" || pane.view === "arch") && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
  drag = { id: e.pointerId, y0: e.clientY, y: e.clientY, t: e.timeStamp, acc: 0, v: 0, moved: false, target: inPane ? "pane" : "log" };
  fling = null; hoverKey = hitAt(e.clientX, e.clientY, true)?.act.key ?? null;
});
canvas.addEventListener("pointermove", (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const dy = e.clientY - drag.y, dt = Math.max(1, e.timeStamp - drag.t);
  if (!drag.moved && Math.abs(e.clientY - drag.y0) > 8) { drag.moved = true; hoverKey = null; }
  if (!drag.moved) return;
  drag.v = drag.v * 0.6 + (-dy / rowPx() / (dt / 1000)) * 0.4;   // rows per second, smoothed
  drag.acc += -dy / rowPx(); drag.y = e.clientY; drag.t = e.timeStamp;
  const rows = Math.trunc(drag.acc); if (rows) { drag.acc -= rows; scrollRowsBy(drag.target, rows); }
});
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  if (drag.moved) { dragEnd = performance.now(); if (e.timeStamp - drag.t < 80 && Math.abs(drag.v) > 4) fling = { target: drag.target, v: drag.v, acc: drag.acc }; }
  drag = null; setTimeout(() => { if (!drag) hoverKey = null; }, 140);
}
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);

// ======================================================================
// frame loop
// ======================================================================
let ping = 0, last = performance.now();
function frame(now) {
  requestAnimationFrame(frame); // schedule first: one bad frame must never freeze the screen
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000;
  powerT = Math.min(1, powerT + dt / 0.55);   // ~0.55 s for the halo to open and fade
  for (const b of blocks) {
    if (b.revealed) { b.tick?.(dt); continue; }
    b.rev = skip || cfg.lps >= 400 ? Infinity : Math.min((b.rev || 0) + cfg.lps * dt, b.rows ?? 1);
    if (b.rev < (b.rows ?? 1)) break;              // later blocks wait their turn
    b.tick?.(dt);
    if (!b.tick || b.done) b.revealed = true; else break;
  }
  if (fling) {
    fling.acc += fling.v * dt; fling.v *= Math.exp(-dt * 3.2);
    const rows = Math.trunc(fling.acc); if (rows) { fling.acc -= rows; scrollRowsBy(fling.target, rows); }
    if (Math.abs(fling.v) < 3) fling = null;
  }
  if (pointer) { const [x, y] = screenToTex(...pointer); const h = hits.find((r) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h); hoverKey = h ? h.act.key : null; canvas.classList.toggle("link", !!h); }
  const live = drawScreen(t);
  placeLive(live); placeDock();
  gl.bindTexture(gl.TEXTURE_2D, textTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, tc);
  gl.useProgram(pPersist); bindQuad(pPersist);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb[ping]); gl.viewport(0, 0, tc.width, tc.height);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, textTex); gl.uniform1i(gl.getUniformLocation(pPersist, "cur"), 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, fbt[1 - ping]); gl.uniform1i(gl.getUniformLocation(pPersist, "prev"), 1);
  gl.uniform1f(gl.getUniformLocation(pPersist, "decay"), cfg.persistence);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(pCrt); bindQuad(pCrt);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fbt[ping]);
  const U = (n) => gl.getUniformLocation(pCrt, n);
  gl.uniform1i(U("tex"), 0); gl.uniform2f(U("res"), tc.width, tc.height); gl.uniform1f(U("time"), t);
  gl.uniform1f(U("curve"), cfg.curvature); gl.uniform1f(U("scan"), cfg.scanlines); gl.uniform1f(U("mask"), cfg.mask);
  gl.uniform1f(U("bloom"), cfg.bloom); gl.uniform1f(U("glow"), cfg.bloomRadius); gl.uniform1f(U("aberr"), cfg.aberration);
  gl.uniform1f(U("noise"), cfg.noise); gl.uniform1f(U("flicker"), cfg.flicker); gl.uniform1f(U("vignette"), cfg.vignette);
  gl.uniform1f(U("jitter"), cfg.jitter); gl.uniform1f(U("power"), powerT);
  gl.uniform4f(U("area"), (cell.x0 - cell.w) / tc.width, 1 - (cell.y0 + (ROWS + 0.5) * cell.h) / tc.height, (cell.x0 + (COLS + 1) * cell.w) / tc.width, 1 - (cell.y0 - cell.h * 0.5) / tc.height);
  gl.uniform3fv(U("tint"), hex(PHOSPHORS[cfg.phosphor]));
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  ping = 1 - ping;
}

// ======================================================================
// boot
// ======================================================================
async function boot() {
  busy = true; skip = false; blocks.length = 0; setSuggestions([]); pane = null; powerT = 0;
  const out = async (s, b = 0.55) => blocks.push(lineBlock([[S(s, b)]]));   // already on the tube; the halo reveals it
  const hi = [
    "██   ██ ██",
    "██   ██ ██",
    "███████ ██",
    "██   ██ ██",
    "██   ██ ██", ""];
  const name = COLS >= 77 ? [
    "█ █ █▄ ▄█    ▄▀▀▀▄ ▀▀█▀▀ ▄▀▀▀▄ █   █ ▄▀▀▀▄ █▄  █    █  ▄▀ █ █     █ ▄▀▀▀▀",
    "█   █ ▀ █    █▀▀▀█   █   █▀▀▀█ █▀▀▀█ █▀▀▀█ █ ▀▄█    █▀▀▄  █ █     █ █",
    "▀   ▀   ▀    ▀   ▀   ▀   ▀   ▀ ▀   ▀ ▀   ▀ ▀   ▀    ▀   ▀ ▀ ▀▀▀▀▀ ▀  ▀█▀▀"] : COLS >= 64 ? [
    "▄▀▀▀▄ ▀▀█▀▀ ▄▀▀▀▄ █   █ ▄▀▀▀▄ █▄  █    █  ▄▀ █ █     █ ▄▀▀▀▀",
    "█▀▀▀█   █   █▀▀▀█ █▀▀▀█ █▀▀▀█ █ ▀▄█    █▀▀▄  █ █     █ █",
    "▀   ▀   ▀   ▀   ▀ ▀   ▀ ▀   ▀ ▀   ▀    ▀   ▀ ▀ ▀▀▀▀▀ ▀  ▀█▀▀"] : ["I'M ATAHAN KILIÇ"];
  for (const l of [...hi, ...name]) await out(l, 1);
  const link = (t, key, fn) => S(t, TXT, { act: { key: "hdr:" + key, fn } });
  const links = [link("github ↗", "gh", () => window.open(C.github, "_blank", "noopener")), gap(2), link("linkedin ↗", "li", () => window.open(C.linkedin, "_blank", "noopener")), gap(2),
    link("email ✉", "mail", () => (location.href = "mailto:" + C.email)), gap(2), link("cv ↓", "cv", downloadCV)];
  const sub = S(`${C.role} · ${C.location}`, 0.95), nameW = Math.max(...name.map((l) => l.length));
  blocks.push({ render(cols) {   // links sit on the title row, flush with the name's right edge; wrap below when it won't fit
    const w = Math.min(cols, Math.max(nameW, sub.t.length + rowLen(links) + 5)), room = w - sub.t.length - rowLen(links);
    return [[], ...(room >= 3 ? [[sub, gap(room), ...links]] : [[sub], [], ...flow(links, cols)]), [], []];
  } });
  blocks.push(textBlock(useLLM()
    ? "This terminal is my digital twin, an AI (an OpenAI model) that knows my work, my projects and my career and answers as me. It can get things wrong, so please don't share personal data. Type a question, or pick one to start:"
    : "This terminal is my digital twin, a scripted bot that knows my work, my projects and my career and answers as me. Type a question, or pick one to start:"));
  blocks.push(lineBlock([[]]), menuBlock);
  busy = false;
  if (!TOUCH) focusKbd();   // a phone keyboard should come up when asked for, not over the welcome screen
}

// a11y / crawler mirror of everything the screen can show
$("#sr").innerHTML = `<h1>${C.name} — ${C.role}</h1><p>${C.tagline}</p>${C.about.map((p) => `<p>${p}</p>`).join("")}<h2>Projects</h2>` +
  C.projects.map((p) => `<h3><a href="${p.live || p.link}">${p.title}</a></h3><p>${p.blurb}</p>`).join("") + `<h2>Contact</h2><p><a href="mailto:${C.email}">${C.email}</a> · <a href="${CV}">CV</a></p><p><a href="impressum.html">Impressum</a> · <a href="privacy.html">Privacy</a></p>`;

// ======================================================================
// config (tube settings + twin settings)
// ======================================================================
const cfg = {
  phosphor: "green", curvature: 0, vignette: 0.7, scanlines: 0, mask: 0,
  bloom: 0.4, bloomRadius: 1.22, aberration: 0, persistence: 0.31, noise: 0.55, flicker: 0, jitter: 0,
  fontSize: 27, resolution: 0.88, lps: 45, cps: 760, // lps/cps: 400 / 2000 = instant
  tint: 0.34, engine: "llm", // "offline" = scripted brain only
};
function applyTint() {
  liveEl.querySelector(".tint").style.background = PHOSPHORS[cfg.phosphor];
  liveEl.querySelector(".tint").style.opacity = cfg.tint;
}
applyTint();
addEventListener("resize", resize);
visualViewport?.addEventListener("resize", resize);
visualViewport?.addEventListener("scroll", resize);
document.fonts.load("24px VT323").finally(() => { resize(); boot(); requestAnimationFrame(frame); });
</script>
